[project]
name = "github-meta-scripts"
version = "0.1.0"
description = "farfarfun 组织 .github 仓库内部脚本依赖（仓库元信息同步、关键词更新）"
readme = "script/update_keyword/REPO_UPDATER_README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.25.0",
    "pandas>=1.3.0",
    "funsecret>=1.4.84",
    "farlog>=1.1.7",
    "funshell>=1.0.23",
]

[tool.uv]
# .github 是组织级配置仓库，不发布到 PyPI；这里的 [project] 只是用 uv 管理
# script/ 下内部脚本的依赖版本，不需要 [build-system]/wheel 构建产物。
# 曾经加过 hatchling 构建配置，会产出一个叫 github-meta-scripts 的 wheel，
# 与仓库名 .github 不一致、也从未被发布，故移除。
package = false
